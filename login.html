<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ramssol Pre-Sales Copilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-50: #E7F9F2;
      --brand-100: #D1F4E6;
      --brand-400: #34C79B;
      --brand-500: #1AA57A;
      --brand-600: #148662;
      --brand-700: #0D6649;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-900: #111827;
      --font: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: #F4F6F8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--gray-900);
    }

    .auth-container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--gray-100);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-sub {
      font-size: 14px;
      color: var(--gray-500);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--gray-900);
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px var(--brand-50);
    }

    .btn-primary {
      width: 100%;
      background: var(--brand-500);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
      font-family: var(--font);
    }

    .btn-primary:hover {
      background: var(--brand-600);
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--gray-500);
    }

    .auth-link {
      color: var(--brand-500);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    /* Hide register form by default */
    #register-form {
      display: none;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <div class="logo-icon">
      <svg viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="#1AA57A" opacity="0.18"/>
        <text x="9" y="27" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#1AA57A">R</text>
      </svg>
    </div>
    <div class="auth-title" id="form-title">Welcome back</div>
    <div class="auth-sub" id="form-sub">Sign in to your Ramssol Copilot account.</div>
  </div>

  <!-- LOGIN FORM -->
  <form id="login-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-input" placeholder="amir.arif@ramssol.com" required>
    </div>
    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label class="form-label" style="margin-bottom:0;">Password</label>
        <a href="#" class="auth-link" style="font-size:12px; font-weight:500;">Forgot password?</a>
      </div>
      <input type="password" class="form-input" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-primary">
      Sign In
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
    <div class="auth-footer">
      Don't have an account? <span class="auth-link" onclick="toggleAuthMode('register')">Create one</span>
    </div>
  </form>

  <!-- REGISTER FORM -->
  <form id="register-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-input" placeholder="Amir Arif" required>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-input" placeholder="amir.arif@ramssol.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" placeholder="Create a strong password" required>
    </div>
    <button type="submit" class="btn-primary">
      Create Account
    </button>
    <div class="auth-footer">
      Already have an account? <span class="auth-link" onclick="toggleAuthMode('login')">Sign in</span>
    </div>
  </form>
</div>

<script>
  function toggleAuthMode(mode) {
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const title = document.getElementById('form-title');
    const sub = document.getElementById('form-sub');

    if (mode === 'register') {
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      title.textContent = 'Create an account';
      sub.textContent = 'Join the Ramssol Pre-Sales Copilot platform.';
    } else {
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
      title.textContent = 'Welcome back';
      sub.textContent = 'Sign in to your Ramssol Copilot account.';
    }
  }
</script>

</body>
</html>
