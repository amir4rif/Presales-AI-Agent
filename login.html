<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ramssol Pre-Sales Copilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #F4F6F8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px;
      border-radius: 12px;
      border: 1px solid var(--gray-100);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo {
      display: inline-flex;
      margin-bottom: 16px;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--gray-500);
    }

    /* Primary button style utilizing your brand color variables */
    .btn-submit {
      width: 100%;
      background: var(--brand-500);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
      font-family: var(--font);
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--brand-600);
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--gray-500);
    }

    .auth-action-link {
      color: var(--brand-500);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .auth-action-link:hover {
      text-decoration: underline;
    }

    #register-view {
      display: none;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="var(--brand-400)"/>
        <text x="10" y="26" font-family="Inter,sans-serif" font-size="20" font-weight="700" fill="white">R</text>
      </svg>
    </div>
    <div class="auth-title" id="auth-main-title">Welcome back</div>
    <div class="auth-subtitle" id="auth-sub-title">Sign in to your Ramssol Copilot account.</div>
  </div>

  <form id="login-view" onsubmit="event.preventDefault(); window.location.href='index.html';">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-input" placeholder="name@ramssol.com" required>
    </div>
    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label class="form-label" style="margin-bottom: 0;">Password</label>
        <a href="#" class="auth-action-link" style="font-size: 11px; font-weight: 500;">Forgot?</a>
      </div>
      <input type="password" class="form-input" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-submit">
      Sign In
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
    <div class="auth-footer">
      Don't have an account? <span class="auth-action-link" onclick="switchView('register')">Create one</span>
    </div>
  </form>

  <form id="register-view" onsubmit="event.preventDefault(); window.location.href='index.html';">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-input" placeholder="Amir Arif" required>
    </div>
    <div class="form-group">
      <label class="form-label">Work Email</label>
      <input type="email" class="form-input" placeholder="name@ramssol.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" placeholder="Minimum 8 characters" required>
    </div>
    <button type="submit" class="btn-submit">
      Create Account
    </button>
    <div class="auth-footer">
      Already have an account? <span class="auth-action-link" onclick="switchView('login')">Sign in</span>
    </div>
  </form>
</div>

<script>
  function switchView(view) {
    const loginForm = document.getElementById('login-view');
    const registerForm = document.getElementById('register-view');
    const mainTitle = document.getElementById('auth-main-title');
    const subTitle = document.getElementById('auth-sub-title');

    if (view === 'register') {
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      mainTitle.textContent = 'Create an account';
      subTitle.textContent = 'Get access to the Ramssol Pre-Sales Copilot.';
    } else {
      registerForm.style.display = 'none';
      loginForm.style.display = 'block';
      mainTitle.textContent = 'Welcome back';
      subTitle.textContent = 'Sign in to your Ramssol Copilot account.';
    }
  }
</script>

</body>
</html>
