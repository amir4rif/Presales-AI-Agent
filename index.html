<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramssol Pre-Sales Copilot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
  <style>
    body { display: flex; align-items: center; justify-content: center; }
    .router { text-align: center; }
    .router img { width: 62px; height: 58px; object-fit: contain; mix-blend-mode: screen; filter: drop-shadow(0 6px 18px rgba(0,212,180,0.5)); margin: 0 auto 18px; }
    .router .rt { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .router .rs { font-size: 12.5px; color: var(--text-muted); margin-top: 5px; }
    .router .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(0,212,180,0.15); overflow: hidden; margin: 18px auto 0; }
    .router .bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, var(--brand-600), var(--teal)); animation: slide 1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div class="router">
    <img src="logoo.png" alt="Ramssol Group">
    <div class="rt">Opening your workspace…</div>
    <div class="rs" id="rt-sub">Checking your access level</div>
    <div class="bar"><i></i></div>
  </div>

<script>
/* Entry router — sends each user to the dashboard built for their
   access level (Doc §2). Level 1 · Data Entry, Level 2 · Reviewer,
   Level 3 · Administrator. */
(function () {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem('ramssolSession') || 'null'); } catch (e) {}
  if (!s) { location.replace('login.html'); return; }

  const ROLE_LEVELS = { 'Sales Representative': 1, 'Sales Manager': 2, 'Sales Operations': 3, 'Pre-Sales': 1, 'COO Office': 3 };
  const level = s.level || ROLE_LEVELS[s.role] || 1;
  const LABEL = { 1: 'Level 1 · Data Entry', 2: 'Level 2 · Reviewer', 3: 'Level 3 · Administrator' };
  document.getElementById('rt-sub').textContent = LABEL[level];

  setTimeout(() => location.replace('dashboard-l' + level + '.html'), 450);
})();
</script>
</body>
</html>
